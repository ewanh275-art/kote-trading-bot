<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kote Trade Terminal - GRAM & Topblast Memes</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-base: #050507;
            --bg-sidebar: #09090d;
            --bg-card: rgba(14, 14, 20, 0.85);
            --bg-input: #15151e;
            --border-color: #27151a;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-moonpay: #7d00ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(rgba(5, 5, 7, 0.75), rgba(5, 5, 7, 0.90)), url('./bg.jpg.JPG') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- CINEMATIC INTRO SCREEN --- */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(5, 5, 7, 0.78), rgba(5, 5, 7, 0.96)), url('./bg.jpg.JPG') no-repeat center center;
            background-size: cover;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            text-align: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #intro-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .intro-content {
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .intro-logo-moon {
            width: 92px;
            height: 92px;
            background: #111116;
            border: 2px solid var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 0 45px rgba(239, 68, 68, 0.45);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(9, 9, 13, 0.88);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            z-index: 10;
        }
        .brand-logo-box {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--accent-red), #7f1d1d);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }
        .brand-text h1 {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.4px;
        }

        /* Content Area Viewport */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
            -webkit-overflow-scrolling: touch;
        }
        .page {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.2s ease-in-out;
        }
        .page.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Cards */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.9px;
        }

        /* Chart Frame */
        .chart-box {
            width: 100%;
            height: 380px;
            background: #030304;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
        }
        .chart-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tokenomics Bar */
        .tokenomics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 10px 6px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card span {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 800;
            display: block;
            margin-bottom: 3px;
        }
        .stat-card strong {
            font-size: 13px;
            font-weight: 900;
            color: var(--accent-red);
        }

        /* Buy / Sell Mode Tabs */
        .trade-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: var(--bg-input);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }
        .trade-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
        }
        .trade-tab-btn.active.buy-mode, .trade-tab-btn.active {
            background: var(--accent-green);
            color: #042f2e;
        }
        .trade-tab-btn.active.sell-mode {
            background: var(--accent-red);
            color: #ffffff;
        }

        /* Inputs */
        .input-group {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .input-group:focus-within {
            border-color: var(--accent-red);
        }
        .input-top {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .input-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pro-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            font-weight: 800;
            width: 60%;
            outline: none;
        }
        .token-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #08080c;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            color: #fff;
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .quick-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
        }
        .quick-btn:hover, .quick-btn.active {
            background: rgba(239, 68, 68, 0.18);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .btn-action:active {
            transform: scale(0.98);
        }
        .btn-red {
            background: linear-gradient(135deg, var(--accent-red), #991b1b);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.38);
        }
        .btn-green-action {
            background: linear-gradient(135deg, var(--accent-green), #059669);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35);
        }
        .btn-moonpay {
            background: linear-gradient(135deg, #7d00ff, #4c0099);
            color: #ffffff;
            box-shadow: 0 4px 22px rgba(125, 0, 255, 0.4);
        }

        .audit-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16,185,129,0.12);
            border: 1px solid rgba(16,185,129,0.3);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .token-avatar-wrap {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #1a1014;
            border: 1px solid rgba(16,185,129,0.35);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .token-avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            z-index: 2;
        }
        .token-avatar-fallback {
            font-size: 16px;
            font-weight: 900;
            color: var(--accent-green);
            z-index: 1;
        }

        .launch-card {
            background: #0b0b0f;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }
        .launch-card:hover {
            border-color: var(--accent-green);
            background: #111118;
        }

        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }
        .page-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(9, 9, 13, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px 0;
            z-index: 30;
            backdrop-filter: blur(20px);
            overflow-x: auto;
        }
        .nav-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 9px;
            font-weight: 800;
            cursor: pointer;
            transition: color 0.15s;
            flex: 1;
            min-width: 50px;
        }
        .nav-tab.active {
            color: var(--accent-red);
        }
    </style>
</head>
<body>

    <!-- --- CINEMATIC INTRO SCREEN --- -->
    <div id="intro-screen">
        <div style="padding-top: 20px; font-weight: 900; color: var(--accent-red); letter-spacing: 2.5px; font-size: 12px;">KOTE TRADE TERMINAL v12.24</div>
        <div class="intro-content">
            <div class="intro-logo-moon">🐱</div>
            <div style="font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 0.5px;">GRAM & TOPBLAST MEMES</div>
        </div>
        <div style="padding-bottom: 20px;">
            <button class="btn-action btn-red" id="enterTerminalBtn" onclick="enterTerminal()" style="max-width: 300px; margin: 0 auto;">
                ⚡ Enter Terminal
            </button>
        </div>
    </div>

    <!-- GLOBAL ROBUST UI CONTROLLER -->
    <script>
        window.enterTerminal = function() {
            const intro = document.getElementById('intro-screen');
            if(intro) {
                intro.classList.add('hidden');
            }
        };

        window.switchPage = function(pageId, navBtn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            const targetId = pageId.startsWith('page-') ? pageId : 'page-' + pageId;
            const targetEl = document.getElementById(targetId);
            if(targetEl) {
                targetEl.classList.add('active');
                const contentArea = document.querySelector('.content-area');
                if(contentArea) contentArea.scrollTop = 0;
            }
            if(navBtn) navBtn.classList.add('active');
        };

        window.currentTradeMode = 'buy';
        window.currentActiveToken = { name: 'Select Token', symbol: 'TOKEN', address: '', poolAddress: '', logo: '', mcap: 0, liq: 0, vol: 0, priceUSD: 0, change24h: 0, decimals: 9 };
        
        window.topblastTokens = JSON.parse(localStorage.getItem('kote_topblast_cache') || '[]').length > 0 ? JSON.parse(localStorage.getItem('kote_topblast_cache')) : [
            { address: 'EQB-MPwuxusWknM7H9N_6U1y59_h_M0nK7wD70t4Z4H6z30U', name: 'Gram Memes Token', symbol: 'GRAM', logo: 'https://asset.ston.fi/img/TON.png', mcap: 1850000, liq: 620000, vol: 450000, priceUSD: 0.85, change24h: 12.4, poolAddress: 'EQB-MPwuxusWknM7H9N_6U1y59_h_M0nK7wD70t4Z4H6z30U' },
            { address: 'EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs', name: 'Tether USD', symbol: 'USDT', logo: 'https://asset.ston.fi/img/EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs.png', mcap: 50000000, liq: 15000000, vol: 8000000, priceUSD: 1.00, change24h: 0.1, poolAddress: 'EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs' }
        ];

        window.gramDedustTokens = JSON.parse(localStorage.getItem('kote_dedust_cache') || '[]').length > 0 ? JSON.parse(localStorage.getItem('kote_dedust_cache')) : [
            { address: 'TON', name: 'Toncoin', symbol: 'TON', logo: 'https://asset.ston.fi/img/TON.png', mcap: 12500000, liq: 4500000, vol: 1200000, priceUSD: 5.65, change24h: 4.2, poolAddress: 'TON' },
            { address: 'EQD_v8Hv7X2d5_gK3Jp1q8s9t2u4v6w8x0y1z3A5B7C9D2E', name: 'Scale TON', symbol: 'SCALE', logo: 'https://assets.dedust.io/images/EQD_v8Hv7X2d5_gK3Jp1q8s9t2u4v6w8x0y1z3A5B7C9D2E.png', mcap: 840000, liq: 310000, vol: 195000, priceUSD: 0.14, change24h: 8.5, poolAddress: 'EQD_v8Hv7X2d5_gK3Jp1q8s9t2u4v6w8x0y1z3A5B7C9D2E' },
            { address: 'EQA4g22tW9bBvH5N_6U1y59_h_M0nK7wD70t4Z4H6z30F', name: 'Fish Crypto', symbol: 'FISH', logo: 'https://asset.ston.fi/img/EQA4g22tW9bBvH5N_6U1y59_h_M0nK7wD70t4Z4H6z30F.png', mcap: 1450000, liq: 520000, vol: 320000, priceUSD: 0.042, change24h: -2.3, poolAddress: 'EQA4g22tW9bBvH5N_6U1y59_h_M0nK7wD70t4Z4H6z30F' },
            { address: 'EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs', name: 'Tether USD', symbol: 'USDT', logo: 'https://asset.ston.fi/img/EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs.png', mcap: 50000000, liq: 15000000, vol: 8000000, priceUSD: 1.00, change24h: 0.1, poolAddress: 'EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs' }
        ];

        window.gramStonfiTokens = JSON.parse(localStorage.getItem('kote_stonfi_cache') || '[]').length > 0 ? JSON.parse(localStorage.getItem('kote_stonfi_cache')) : [
            { address: 'EQB-MPwuxusWknM7H9N_6U1y59_h_M0nK7wD70t4Z4H6z30U', name: 'STON.fi Token', symbol: 'STON', logo: 'https://asset.ston.fi/img/STON.png', mcap: 9200000, liq: 2800000, vol: 950000, priceUSD: 2.10, change24h: -1.5, poolAddress: 'EQB-MPwuxusWknM7H9N_6U1y59_h_M0nK7wD70t4Z4H6z30U' },
            { address: 'TON', name: 'Toncoin', symbol: 'TON', logo: 'https://asset.ston.fi/img/TON.png', mcap: 12500000, liq: 4500000, vol: 1200000, priceUSD: 5.65, change24h: 4.2, poolAddress: 'TON' },
            { address: 'EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs', name: 'Tether USD', symbol: 'USDT', logo: 'https://asset.ston.fi/img/EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs.png', mcap: 50000000, liq: 15000000, vol: 8000000, priceUSD: 1.00, change24h: 0.1, poolAddress: 'EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs' }
        ];

        let currentDedustPage = 1;
        let currentStonfiPage = 1;
        let currentTopblastPage = 1;
        const itemsPerPage = 10;

        window.switchGramSubTab = function(tabName) {
            const dedustBtn = document.getElementById('gramSubDedust');
            const stonfiBtn = document.getElementById('gramSubStonfi');
            const dedustContainer = document.getElementById('gramDedustContainer');
            const stonfiContainer = document.getElementById('gramStonfiContainer');

            if (!dedustBtn || !stonfiBtn || !dedustContainer || !stonfiContainer) return;

            if (tabName === 'dedust') {
                dedustBtn.classList.add('active');
                stonfiBtn.classList.remove('active');
                dedustContainer.style.display = 'block';
                stonfiContainer.style.display = 'none';
                renderGramDedustList();
            } else {
                stonfiBtn.classList.add('active');
                dedustBtn.classList.remove('active');
                dedustContainer.style.display = 'none';
                stonfiContainer.style.display = 'block';
                renderGramStonfiList();
            }
        };

        function renderAllInstantly() {
            renderTopblastList();
            renderGramDedustList();
            renderGramStonfiList();
        }

        window.handleTokenCardClick = function(address, symbol, poolAddress) {
            const allTokens = (window.topblastTokens || []).concat(window.gramDedustTokens || []).concat(window.gramStonfiTokens || []);
            const found = allTokens.find(t => t.address.toLowerCase() === address.toLowerCase());
            if (found && typeof window.selectTokenForTrade === 'function') {
                window.selectTokenForTrade(
                    found.address, found.name, found.symbol, found.logo, 
                    found.mcap, found.liq, found.vol, found.priceUSD, 
                    found.change24h || 0, true, 'dedust', found.poolAddress
                );
            }
        };

        window.changeTopblastPage = function(dir) {
            const q = (document.getElementById('topblastSearchInput')?.value || '').toLowerCase();
            const filtered = window.topblastTokens.filter(t => t.name.toLowerCase().includes(q) || t.symbol.toLowerCase().includes(q) || t.address.toLowerCase().includes(q));
            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            currentTopblastPage = Math.min(Math.max(1, currentTopblastPage + dir), totalPages);
            renderTopblastList();
        };

        window.changeDedustPage = function(dir) {
            const q = (document.getElementById('gramMemesSearchInput')?.value || '').toLowerCase();
            const filtered = window.gramDedustTokens.filter(t => t.name.toLowerCase().includes(q) || t.symbol.toLowerCase().includes(q) || t.address.toLowerCase().includes(q));
            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            currentDedustPage = Math.min(Math.max(1, currentDedustPage + dir), totalPages);
            renderGramDedustList();
        };

        window.changeStonfiPage = function(dir) {
            const q = (document.getElementById('gramMemesSearchInput')?.value || '').toLowerCase();
            const filtered = window.gramStonfiTokens.filter(t => t.name.toLowerCase().includes(q) || t.symbol.toLowerCase().includes(q) || t.address.toLowerCase().includes(q));
            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            currentStonfiPage = Math.min(Math.max(1, currentStonfiPage + dir), totalPages);
            renderGramStonfiList();
        };

        window.filterTopblastList = function() { currentTopblastPage = 1; renderTopblastList(); };
        window.filterGramMemesList = function() { currentDedustPage = 1; currentStonfiPage = 1; renderGramDedustList(); renderGramStonfiList(); };

        function formatCompactUSD(val) {
            if (!val || val <= 0) return '$0.0K';
            if (val >= 1e6) return '$' + (val / 1e6).toFixed(2) + 'M';
            if (val >= 1e3) return '$' + (val / 1e3).toFixed(1) + 'K';
            return '$' + val.toFixed(2);
        }

        function renderTopblastList() {
            const q = (document.getElementById('topblastSearchInput')?.value || '').toLowerCase();
            const filtered = window.topblastTokens.filter(t => t.name.toLowerCase().includes(q) || t.symbol.toLowerCase().includes(q) || t.address.toLowerCase().includes(q));
            const container = document.getElementById('topblastList');
            const paginationBar = document.getElementById('topblastPaginationBar');
            if(!container) return;

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-muted); font-size: 12px;">No Topblast memes available.</div>`;
                if(paginationBar) paginationBar.style.display = 'none';
                return;
            }

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentTopblastPage > totalPages) currentTopblastPage = totalPages;

            const startIndex = (currentTopblastPage - 1) * itemsPerPage;
            const paginatedItems = filtered.slice(startIndex, startIndex + itemsPerPage);

            container.innerHTML = '';
            paginatedItems.forEach(t => {
                const formattedMcap = formatCompactUSD(t.mcap);

        window.selectTokenForTrade = function(address, name, symbol, logo, mcap, liq, vol, priceUSD = 0.01, change24h = 0, graduated = true, migrationDex = 'dedust', poolAddress = '') {
            window.currentActiveToken = { name, symbol, address, poolAddress, logo, mcap, liq, vol, priceUSD, change24h };
            document.getElementById('heroTokenName').innerText = `${name} ($${symbol})`;
            document.getElementById('heroTokenCA').innerText = address;
            document.getElementById('heroTokenFallback').innerText = symbol.charAt(0);
            
            const logoEl = document.getElementById('heroTokenLogo');
            if(logo) {
                logoEl.style.display = 'block';
                logoEl.src = logo;
            } else {
                logoEl.style.display = 'none';
            }

            document.getElementById('receiveTokenSymbol').innerText = symbol;
            document.getElementById('chartTitle').innerText = `📊 Live Chart: $${symbol}`;
            document.getElementById('dexChartFrame').src = `https://dexscreener.com/ton/${poolAddress || address}?embed=1&theme=dark&trades=0&info=0`;
            document.getElementById('externalChartBtn').href = `https://dexscreener.com/ton/${poolAddress || address}`;
            
            document.getElementById('tokMcap').innerText = formatCompactUSD(mcap);
            document.getElementById('tokLiq').innerText = formatCompactUSD(liq);
            document.getElementById('tokVol').innerText = formatCompactUSD(vol);
            document.getElementById('heroTokenPrice').innerText = '$' + (priceUSD || 0).toFixed(6);

            const changeEl = document.getElementById('heroTokenChange');
            const cVal = parseFloat(change24h || 0);
            changeEl.innerText = `${cVal >= 0 ? '+' : ''}${cVal.toFixed(2)}% (24h)`;
            changeEl.style.color = cVal >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';

            switchPage('trade', document.querySelectorAll('.nav-tab')[0]);
            calculateSwapOutput();
        };

        window.selectTokenForSniper = function(address, symbol) {
            const sniperInput = document.getElementById('sniperCA');
            if (sniperInput) sniperInput.value = address;
            switchPage('sniper', document.querySelectorAll('.nav-tab')[1]);
        };

        window.calculateSwapOutput = function() {
            const inputVal = parseFloat(document.getElementById('tradeInputAmount').value) || 0;
            const resOutput = window.currentTradeMode === 'buy' ? inputVal * 850.5 : inputVal / 850.5;
            document.getElementById('tradeOutputAmount').value = '~ ' + resOutput.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
        };

        // Render immediately
        renderAllInstantly();
        calculateSwapOutput();
