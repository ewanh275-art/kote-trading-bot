<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kote Trading & Sniper Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TonConnect UI CDN -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }
        .dashboard {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            text-align: center;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; color: #38bdf8;">🐱 Kote Trading Bot</div>
        <!-- TonConnect Wallet Button Container -->
        <div id="ton-connect"></div>
    </div>

    <div class="dashboard">
        <div class="card">
            <h2>⚡ Sniper & Trading Hub</h2>
            <p style="color: #94a3b8; font-size: 14px;">Connect your wallet via TonConnect above to automate snipes and track active trades instantly.</p>
        </div>

        <div class="card">
            <h3>📈 Quick Snipe</h3>
            <input type="text" id="tokenInput" placeholder="Paste Token Contract Address..." style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box;">
            <button class="action-btn" onclick="executeSnipe()">SNIPE TOKEN 🚀</button>
        </div>
    </div>

    <script>
        // Initialize TonConnect UI pointing to your repository manifest
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://ewanh275-art.github.io/kote-trading-bot/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg && typeof tg.expand === 'function') {
            tg.expand();
        }

        function executeSnipe() {
            const address = document.getElementById('tokenInput').value;
            if (!address) {
                alert("Please enter a valid token contract address!");
                return;
            }
            alert("Snipe order dispatched for contract: " + address);
        }
    </script>
</body>
</html>
