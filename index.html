        async function resolveDeDustPoolAddress(inputAddress) {
            try {
                const tokenRes = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${inputAddress}`);
                const tokenData = await tokenRes.json();
                if (tokenData.pairs && tokenData.pairs.length > 0) {
                    const dedustPairs = tokenData.pairs.filter(p => p.chainId === 'ton' && p.dexId?.toLowerCase() === 'dedust');
                    if (dedustPairs.length > 0) {
                        dedustPairs.sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
                        return {
                            poolAddress: dedustPairs[0].pairAddress,
                            tokenAddress: dedustPairs[0].baseToken?.address || inputAddress,
                            symbol: dedustPairs[0].baseToken?.symbol || 'TOKEN',
                            name: dedustPairs[0].baseToken?.name || 'Token',
                            priceUsd: parseFloat(dedustPairs[0].priceUsd) || 0.01
                        };
                    }
                }
            } catch (e) {}
            return { poolAddress: inputAddress, tokenAddress: inputAddress, symbol: 'TOKEN', name: 'Token', priceUsd: 0.01 };
        }

        async function hydrateTokenCatalog(addresses, targetArray, renderCallback) {
            targetArray.length = 0;
            addresses.forEach((ca, idx) => {
                targetArray.push({
                    name: `Token #${idx + 1}`,
                    symbol: `MEME${idx + 1}`,
                    address: ca,
                    poolAddress: '',
                    graduated: true,
                    migrationDex: 'dedust',
                    logo: 'https://dedust.io/favicon.ico',
                    mcap: 50000 + (idx * 15000),
                    liq: 20000 + (idx * 5000),
                    vol: 10000 + (idx * 2000),
                    priceUSD: 0.01 + (idx * 0.005),
                    statusText: 'Graduated (DEDUST)'
                });
            });
            renderCallback();

            if (addresses.length === 0) return;
            try {
                const chunk = addresses.slice(0, 30).join(',');
                const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${chunk}`);
                const data = await res.json();
                const pairs = data.pairs || [];

                pairs.forEach(p => {
                    const tokenAddr = p.baseToken?.address || p.pairAddress;
                    const match = targetArray.find(t => t.address.toLowerCase() === tokenAddr.toLowerCase());
                    if (match) {
                        match.name = p.baseToken?.name || match.name;
                        match.symbol = p.baseToken?.symbol || match.symbol;
                        match.poolAddress = p.pairAddress || match.poolAddress;
                        match.logo = p.info?.imageUrl || p.baseToken?.logoURI || match.logo;
                        match.mcap = p.marketCap || p.fdv || match.mcap;
                        match.liq = p.liquidity?.usd || match.liq;
                        match.vol = p.volume?.h24 || match.vol;
                        match.priceUSD = parseFloat(p.priceUsd) || match.priceUSD;
                        match.statusText = `Graduated (${(p.dexId || 'dedust').toUpperCase()})`;
                    }
                });
                renderCallback();
            } catch (e) {}
        }

        window.auditSniperCA = async function(ca) {
            const auditEl = document.getElementById('sniperAuditResult');
            const logoWrap = document.getElementById('sniperTokenLogoWrap');
            const logoImg = document.getElementById('sniperTokenLogoImg');
            const logoFallback = document.getElementById('sniperLogoFallback');

            if (!ca || ca.length < 10) { 
                auditEl.style.display = 'none'; 
                logoWrap.style.display = 'none';
                return; 
            }
            auditEl.style.display = 'inline-flex';
            auditEl.innerText = '🔍 Resolving DeDust Pool...';

            const resolved = await resolveDeDustPoolAddress(ca.trim());
            auditEl.innerText = `🛡️ DeDust Pool Verified: ${resolved.poolAddress.slice(0, 6)}...${resolved.poolAddress.slice(-4)}`;

            try {
                const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${resolved.tokenAddress}`);
                const d = await r.json();
                if (d.pairs && d.pairs.length > 0) {
                    const p = d.pairs[0];
                    const logoUrl = p.info?.imageUrl || p.baseToken?.logoURI;
                    const sym = p.baseToken?.symbol || '?';
                    logoFallback.innerText = sym.charAt(0);
                    if (logoUrl) {
                        logoImg.style.display = 'block';
                        logoImg.src = logoUrl;
                    } else {
                        logoImg.style.display = 'none';
                    }
                    logoWrap.style.display = 'flex';
                }
            } catch (err) {
                logoWrap.style.display = 'none';
            }
        };

        function getHeldTokenInfo(tokenAddr) {
            if (!tokenAddr) return null;
            if (userJettonHoldingsMap.has(tokenAddr)) return userJettonHoldingsMap.get(tokenAddr);
            try {
                const raw = Address.parse(tokenAddr).toRawString();
                for (const [k, v] of userJettonHoldingsMap.entries()) {
                    if (Address.parse(k).toRawString() === raw) return v;
                }
            } catch (e) {}
            return null;
        }

        async function calculateSwapOutput() {
            const inputVal = parseFloat(document.getElementById('tradeInputAmount').value) || 0;
            if (inputVal <= 0 || !currentActiveToken.address) {
                document.getElementById('tradeOutputAmount').value = '~ 0.00';
                return;
            }
            const netInput = (currentTradeMode === 'buy' && inputVal >= 0.5) ? inputVal * 0.90 : inputVal;
            try {
                const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${currentActiveToken.address}`);
                const data = await res.json();
                const pairs = data.pairs || [];
                if (pairs.length > 0) {
                    const pair = pairs[0];
                    const priceNative = parseFloat(pair.priceNative) || 0.0012;
                    currentActiveToken.priceNative = priceNative;
                    if(pair.priceUsd) currentActiveToken.priceUSD = parseFloat(pair.priceUsd);
                    if(!currentActiveToken.poolAddress && pair.pairAddress) currentActiveToken.poolAddress = pair.pairAddress;
                    
                    let exactOutput = currentTradeMode === 'buy' ? netInput / priceNative : netInput * priceNative;
                    document.getElementById('tradeOutputAmount').value = '~ ' + exactOutput.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 6 });
                } else {
                    const fallbackRate = 850.5;
                    const resOutput = currentTradeMode === 'buy' ? netInput * fallbackRate : netInput / fallbackRate;
                    document.getElementById('tradeOutputAmount').value = '~ ' + resOutput.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
                }
            } catch (e) {
                const fallbackRate = 850.5;
                const resOutput = currentTradeMode === 'buy' ? netInput * fallbackRate : netInput / fallbackRate;
                document.getElementById('tradeOutputAmount').value = '~ ' + resOutput.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
            }
        }
        window.calculateSwapOutput = calculateSwapOutput;

        function saveTradeToPersistentProfile(tradeObj) {
            if (!userWalletAddress) return;
            const storageKey = `kote_trades_${userWalletAddress}`;
            let existingTrades = JSON.parse(localStorage.getItem(storageKey) || '[]');
            const idx = existingTrades.findIndex(t => t.address === tradeObj.address);
            if (idx >= 0) {
                existingTrades[idx].costBasisUSD += tradeObj.costBasisUSD;
            } else {
                existingTrades.push(tradeObj);
            }
            localStorage.setItem(storageKey, JSON.stringify(existingTrades));
        }

        async function fetchRealWalletHoldings(address) {
            const holdingsContainer = document.getElementById('onChainWalletHoldings');
            const activeTradesContainer = document.getElementById('mainActiveTradesList');
            if(!holdingsContainer || !activeTradesContainer) return;
            
            holdingsContainer.innerHTML = `<div style="text-align: center; padding: 15px; color: var(--text-muted); font-size: 12px;">Querying TonAPI blockchain...</div>`;
            activeTradesContainer.innerHTML = `<div style="text-align: center; padding: 15px; color: var(--text-muted); font-size: 12px;">Calculating persistent trades & live PnL...</div>`;

            try {
                const res = await fetch(`https://tonapi.io/v2/accounts/${address}/jettons`);
                const data = await res.json();
                let balances = data.balances || [];

                userJettonHoldingsMap.clear();
                const storageKey = `kote_trades_${address}`;
                let persistentTrades = JSON.parse(localStorage.getItem(storageKey) || '[]');

                let parsedBalances = [];
                for (const b of balances) {
                    const rawBal = parseFloat(b.balance) || 0;
                    if (rawBal <= 0) continue;

                    const decimals = b.jetton.decimals || 9;
                    const amount = rawBal / Math.pow(10, decimals);
                    const tokenAddr = b.jetton.address;
                    const jettonWalletAddr = b.wallet_address?.address || '';

                    userJettonHoldingsMap.set(tokenAddr, {
                        balance: amount,
                        rawBalance: BigInt(b.balance),
                        decimals,
                        jettonWalletAddress: jettonWalletAddr
                    });

                    const name = b.jetton.name || 'Unknown';
                    const symbol = b.jetton.symbol || 'JETTON';
                    const image = b.jetton.image || `https://cache.tonapi.io/imgproxy/${tokenAddr}/rs:fill:200:200:1/g:no`;

                    let priceUSD = 0.01;
                    let priceChange24h = 0;
                    let poolAddress = '';
                    try {
                        const dexRes = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${tokenAddr}`);
                        const dexData = await dexRes.json();
                        if (dexData.pairs && dexData.pairs.length > 0) {
                            const pair = dexData.pairs[0];
                            priceUSD = parseFloat(pair.priceUsd) || 0.01;
                            priceChange24h = pair.priceChange?.h24 || 0;
                            poolAddress = pair.pairAddress || '';
                        }
                    } catch (err) {}

                    const estUsdValue = amount * priceUSD;
                    let recordedTrade = persistentTrades.find(t => t.address === tokenAddr);
                    let costBasisUSD = recordedTrade ? recordedTrade.costBasisUSD : estUsdValue * (1 - (priceChange24h / 100));

                    const pnlUSD = estUsdValue - costBasisUSD;
                    const pnlPercent = costBasisUSD > 0 ? (pnlUSD / costBasisUSD) * 100 : priceChange24h;

                    parsedBalances.push({
                        name, symbol, address: tokenAddr, poolAddress, amount, image, estUsdValue, priceUSD, pnlUSD, pnlPercent
                    });
                }

                parsedBalances.sort((a, b) => b.estUsdValue - a.estUsdValue);

                holdingsContainer.innerHTML = '';
                activeTradesContainer.innerHTML = '';

                if (parsedBalances.length === 0) {
                    holdingsContainer.innerHTML = `<div style="text-align: center; padding: 15px; color: var(--text-muted); font-size: 12px;">No jetton balances found.</div>`;
                    activeTradesContainer.innerHTML = `<div style="text-align: center; padding: 15px; color: var(--text-muted); font-size: 12px;">No active trades found. Sold or transferred tokens disappear automatically.</div>`;
                    return;
                }

                parsedBalances.forEach(item => {
                    const pnlColor = item.pnlPercent >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
                    const pnlSign = item.pnlPercent >= 0 ? '+' : '';

                    holdingsContainer.innerHTML += `
                        <div class="launch-card" onclick="selectTokenForTrade('${item.address}', '${item.name.replace(/'/g, "\\'")}', '${item.symbol}', '${item.image}', 50000, 20000, 10000, ${item.priceUSD}, true, 'dedust', '${item.poolAddress}')">
                            <div style="display:flex; align-items:center; gap:12px;">
                                <div class="token-avatar-wrap">
                                    <span class="token-avatar-fallback">${item.symbol.charAt(0)}</span>
                                    <img src="${item.image}" onerror="this.style.display='none';">
                                </div>
                                <div>
                                    <h4 style="font-size:13px; font-weight:800;">$${item.symbol}</h4>
                                    <span style="font-size:11px; color:var(--text-muted);">${item.name}</span>
                                </div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-size:10px; color:var(--text-muted); text-transform:uppercase; font-weight:700;">Holdings</div>
                                <div style="font-size:13px; font-weight:900; color:var(--accent-green);">~$${item.estUsdValue.toFixed(2)}</div>
                            </div>
                        </div>
                    `;

                    activeTradesContainer.innerHTML += `
                        <div style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <div class="token-avatar-wrap" style="width: 42px; height: 42px;">
                                        <span class="token-avatar-fallback">${item.symbol.charAt(0)}</span>
                                        <img src="${item.image}" onerror="this.style.display='none';">
                                    </div>
                                    <div>
                                        <h4 style="font-size:14px; font-weight:900; color:#fff;">$${item.symbol}</h4>
                                        <span style="font-size:11px; color:var(--text-muted); font-weight:700;">${item.name}</span>
                                    </div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-size:14px; font-weight:900; color:#fff;">~$${item.estUsdValue.toFixed(2)}</div>
                                    <div style="font-size:11px; font-weight:800; color:${pnlColor};">${pnlSign}${item.pnlPercent.toFixed(2)}% (${pnlSign}$${item.pnlUSD.toFixed(2)})</div>
                                </div>
                            </div>

                            <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); background: rgba(0,0,0,0.3); padding: 8px 10px; border-radius: 8px; margin-bottom: 10px;">
                                <span>Amount Bought / Held: <strong style="color: #fff;">${item.amount.toLocaleString(undefined, {maximumFractionDigits: 4})} ${item.symbol}</strong></span>
                                <span>Live Price: <strong style="color: var(--accent-green)">$${item.priceUSD.toFixed(6)}</strong></span>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                <button onclick="selectTokenForTrade('${item.address}', '${item.name.replace(/'/g, "\\'")}', '${item.symbol}', '${item.image}', 50000, 20000, 10000, ${item.priceUSD}, true, 'dedust', '${item.poolAddress}'); setTradeMode('buy'); switchPage('trade', document.querySelectorAll('.nav-tab')[0]);" style="background: rgba(16,185,129,0.15); border: 1px solid var(--accent-green); color: var(--accent-green); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 900; cursor: pointer;">🟢 Buy More</button>
                                <button onclick="selectTokenForTrade('${item.address}', '${item.name.replace(/'/g, "\\'")}', '${item.symbol}', '${item.image}', 50000, 20000, 10000, ${item.priceUSD}, true, 'dedust', '${item.poolAddress}'); setTradeMode('sell'); switchPage('trade', document.querySelectorAll('.nav-tab')[0]);" style="background: rgba(239,68,68,0.15); border: 1px solid var(--accent-red); color: var(--accent-red); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 900; cursor: pointer;">🔴 Sell Position</button>
                            </div>
                        </div>
                    `;
                });

            } catch (e) {
                holdingsContainer.innerHTML = `<div style="text-align: center; padding: 15px; color: var(--accent-red); font-size: 12px;">Failed to fetch live on-chain holdings.</div>`;
                activeTradesContainer.innerHTML = `<div style="text-align: center; padding: 15px; color: var(--accent-red); font-size: 12px;">Failed to load active trades.</div>`;
            }
        }

        window.manualSyncActiveTrades = function() {
            if (!userWalletAddress) { alert('Please connect your wallet first.'); return; }
            fetchRealWalletHoldings(userWalletAddress);
            alert('✅ Active trades synchronized with blockchain!');
        };

        async function verifyBlockchainTransactions(address) {
            try {
                const res = await fetch(`https://tonapi.io/v2/blockchain/accounts/${address}/transactions?limit=30`);
                const data = await res.json();
                const txs = data.transactions || [];

                let confirmedReferralTotal = 0;
                referredTradersSet.clear();

                txs.forEach(tx => {
                    if (tx.in_msg && tx.in_msg.destination && tx.in_msg.destination.address === address) {
                        const comment = tx.in_msg.comment || '';
                        if (comment.includes('KoteTrade Ref Fee') || comment.includes('KoteTrade')) {
                            const valTon = parseFloat(tx.in_msg.value || 0) / 1e9;
                            if (valTon > 0 && tx.in_msg.source && tx.in_msg.source.address) {
                                referredTradersSet.add(tx.in_msg.source.address);
                                confirmedReferralTotal += valTon;
                            }
                        }
                    }
                });

                referralEarnings = confirmedReferralTotal;
                document.getElementById('referralEarnings').innerText = referralEarnings.toFixed(4) + ' GRAM';
                document.getElementById('referredCount').innerText = referredTradersSet.size + ' Users';
            } catch (e) {}
        }

        window.manualSyncPortfolio = function() {
            if (!userWalletAddress) { alert('Please connect your wallet first.'); return; }
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '🔄 Syncing Blockchain...';
            
            Promise.all([
                fetchRealWalletHoldings(userWalletAddress),
                verifyBlockchainTransactions(userWalletAddress)
            ]).then(() => {
                btn.innerHTML = originalText;
                alert('✅ On-chain data synchronized successfully!');
            }).catch(err => {
                btn.innerHTML = originalText;
                alert('Sync failed, please try again in a few seconds.');
            });
        };

        window.copyReferralLink = function() {
            const link = document.getElementById('refLinkInput').value;
            if (!link.includes('http')) { alert('Connect wallet first.'); return; }
            navigator.clipboard.writeText(link);
            alert('Referral link copied!');
        };

        function buildDeDustBuyMessages(inputVal, resolvedPoolAddr) {
            const isMicroTrade = inputVal < 0.5;
            const totalFeeAmount = isMicroTrade ? 0 : inputVal * 0.10;
            const netAmount = inputVal - totalFeeAmount;

            let messages = [];

            if (!isMicroTrade && totalFeeAmount > 0) {
                const refCommentCell = beginCell()
                    .storeUint(0, 32)
                    .storeStringTail("KoteTrade Ref Fee")
                    .endCell();
                const refPayloadBoc = refCommentCell.toBoc().toString('base64');

                if (referrerAddress) {
                    const referrerFee = totalFeeAmount * 0.30; 
                    const treasuryFee = totalFeeAmount * 0.70; 
                    messages.push({ address: referrerAddress, amount: Math.floor(referrerFee * 1e9).toString(), payload: refPayloadBoc });
                    messages.push({ address: TREASURY_ADDRESS, amount: Math.floor(treasuryFee * 1e9).toString() });
                } else {
                    messages.push({ address: TREASURY_ADDRESS, amount: Math.floor(totalFeeAmount * 1e9).toString() });
                }
            }

            const poolAddr = Address.parse(resolvedPoolAddr);
            const userAddr = Address.parse(userWalletAddress);

            const swapPayload = VaultNative.createSwapPayload({
                poolAddress: poolAddr,
                amount: BigInt(Math.floor(netAmount * 1e9)),
                swapParams: {
                    recipientAddress: userAddr,
                    ...(referrerAddress ? { referralAddress: Address.parse(referrerAddress) } : {})
                }
            });

            const payloadBoc = swapPayload.toBoc().toString('base64');
            const swapTonTotal = netAmount + DEDUST_FORWARD_GAS;

            messages.push({
                address: DEDUST_NATIVE_VAULT,
                amount: Math.floor(swapTonTotal * 1e9).toString(),
                payload: payloadBoc
            });

            return { messages, netAmount };
        }

        async function buildDeDustSellMessages(tokenAmount, tokenAddrStr, resolvedPoolAddr) {
            const held = getHeldTokenInfo(tokenAddrStr);
            if (!held || !held.jettonWalletAddress) {
                throw new Error("Could not find your Jetton Wallet for this token. Make sure you hold this token.");
            }

            const decimals = held.decimals || 9;
            const rawJettonAmount = BigInt(Math.floor(tokenAmount * Math.pow(10, decimals)));
            if (rawJettonAmount <= 0n) {
                throw new Error("Sell amount must be greater than 0.");
            }

            const jettonMasterAddr = Address.parse(tokenAddrStr);
            const jettonVault = await dedustFactory.getJettonVault(jettonMasterAddr);
            const poolAddr = Address.parse(resolvedPoolAddr);
            const userAddr = Address.parse(userWalletAddress);

            const forwardSwapPayload = VaultJetton.createSwapPayload({
                poolAddress: poolAddr,
                swapParams: {
                    recipientAddress: userAddr,
                    ...(referrerAddress ? { referralAddress: Address.parse(referrerAddress) } : {})
                }
            });

            const jettonTransferBody = beginCell()
                .storeUint(0x0f8a7ea5, 32)
                .storeUint(0n, 64)
                .storeCoins(rawJettonAmount)
                .storeAddress(jettonVault.address)
                .storeAddress(userAddr)
                .storeBit(0)
                .storeCoins(BigInt(Math.floor(0.20 * 1e9)))
                .storeBit(1)
                .storeRef(forwardSwapPayload)
                .endCell();

            const messages = [{
                address: Address.parse(held.jettonWalletAddress).toString(),
                amount: Math.floor(0.25 * 1e9).toString(),
                payload: jettonTransferBody.toBoc().toString('base64')
            }];

            return { messages };
        }

        window.executeOnChainTrade = async function() {
            if (!tonConnectUI.connected) { tonConnectUI.openModal(); return; }

            const inputVal = parseFloat(document.getElementById('tradeInputAmount').value) || 0;
            if (inputVal <= 0 || !currentActiveToken.address) {
                alert('Please select a valid token and enter a trade amount.');
                return;
            }

            const btn = document.getElementById('executeTradeBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '🔍 Resolving DeDust Pool...';
            btn.disabled = true;

            try {
                const resolved = await resolveDeDustPoolAddress(currentActiveToken.poolAddress || currentActiveToken.address);

                if (currentTradeMode === 'buy') {
                    btn.innerHTML = '🛡️ Signing In-App Buy...';
                    const { messages, netAmount } = buildDeDustBuyMessages(inputVal, resolved.poolAddress);

                    const transaction = { validUntil: Math.floor(Date.now() / 1000) + 360, messages };
                    await tonConnectUI.sendTransaction(transaction);

                    saveTradeToPersistentProfile({
                        address: resolved.tokenAddress,
                        symbol: resolved.symbol,
                        name: resolved.name,
                        costBasisUSD: netAmount * resolved.priceUsd,
                        timestamp: Date.now()
                    });

                    alert(`✅ In-App Buy Confirmed!\n\n• Pool: ${resolved.poolAddress.slice(0,6)}...\n• Net Buy: ${netAmount} GRAM for $${resolved.symbol}\n• Tokens routed directly to your wallet!`);
                } else {
                    btn.innerHTML = '🛡️ Preparing In-App Sell...';
                    const { messages } = await buildDeDustSellMessages(inputVal, resolved.tokenAddress, resolved.poolAddress);

                    btn.innerHTML = '🛡️ Signing In-App Sell...';
                    const transaction = { validUntil: Math.floor(Date.now() / 1000) + 360, messages };
                    await tonConnectUI.sendTransaction(transaction);

                    alert(`✅ In-App Sell Confirmed!\n\n• Sold: ${inputVal.toLocaleString()} $${resolved.symbol}\n• Output GRAM routed directly to your wallet!`);
                }

                setTimeout(() => {
                    if (userWalletAddress) {
                        verifyBlockchainTransactions(userWalletAddress);
                        fetchRealWalletHoldings(userWalletAddress);
                    }
                }, 12000);

                btn.innerHTML = originalText;
                btn.disabled = false;
            } catch (error) {
                alert(`Trade Cancelled or Failed: ${error.message || error}`);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        window.executeSnipeOrder = async function() {
            if (!tonConnectUI.connected) { tonConnectUI.openModal(); return; }
            const ca = document.getElementById('sniperCA').value.trim();
            const amtGram = parseFloat(document.getElementById('sniperAmount').value) || 0;

        window.launchMoonPay = function() {
            if (!userWalletAddress) {
                alert('Please connect your TON wallet via TonConnect first.');
                tonConnectUI.openModal();
                return;
            }
            const amount = document.getElementById('fiatAmount').value || 100;

            if (tg && typeof tg.openLink === 'function') { tg.openLink(url); } else { window.open(url, '_blank'); }
        };

        // --- IMMEDIATE INITIALIZATION ON BOOT ---
        loadTopblastTokens();
        loadGramMemesTokens();
        calculateSwapOutput();
    </script>
